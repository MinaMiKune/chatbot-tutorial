<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>POOL — 人机对战</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at 50% 40%, #2A2218 0%, #1C1812 45%, #0E0C08 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    user-select: none;
    overflow: hidden;
    color: #C8A96E;
  }

  /* ===== 整体布局 ===== */
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ===== 顶栏 ===== */
  #topBar {
    width: 960px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 12px 0;
  }

  /* ===== 游戏标题 ===== */
  #titleBlock {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  #gameTitle {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: 26px;
    color: #C8A96E;
    letter-spacing: 10px;
    line-height: 1;
    text-shadow: 0 0 30px rgba(200,169,110,0.3);
  }
  #gameSubtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 10px;
    color: #6B5C48;
    letter-spacing: 5px;
    text-transform: uppercase;
    font-style: italic;
  }

  /* ===== 玩家面板 ===== */
  .player-panel {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    background: #1C1812;
    border-radius: 4px;
    border: 1px solid #2E2820;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(200,169,110,0.04);
    min-width: 240px;
    transition: all 0.3s ease;
    position: relative;
  }
  .player-panel.active {
    border-color: #C8A96E;
    box-shadow: 0 0 24px rgba(200,169,110,0.12), 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(200,169,110,0.1);
    background: #1E1A14;
  }

  .player-side { display: flex; flex-direction: column; gap: 2px; }

  .player-name {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 400;
    color: #C8A96E;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .player-group-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    color: #5A4E3A;
    letter-spacing: 2px;
    min-height: 16px;
    font-style: italic;
  }
  .player-panel.active .player-group-label { color: #8A7658; }

  /* 激活指示条 */
  .player-panel::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 50%; right: 50%;
    height: 2px;
    background: #C8A96E;
    border-radius: 2px 2px 0 0;
    transition: left 0.3s ease, right 0.3s ease;
    box-shadow: 0 0 8px rgba(200,169,110,0.4);
  }
  .player-panel.active::after { left: 20px; right: 20px; }

  .ball-rack {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .ball-slot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1.5px solid #2E2820;
    background: #141210;
    transition: all 0.3s;
  }
  .ball-slot.solid {
    background: #C8A96E;
    border-color: #D4BB82;
    box-shadow: 0 0 6px rgba(200,169,110,0.5);
  }
  .ball-slot.stripe {
    background: linear-gradient(180deg, #C8A96E 35%, #1C1812 35%, #1C1812 65%, #C8A96E 65%);
    border-color: #D4BB82;
    box-shadow: 0 0 6px rgba(200,169,110,0.3);
  }
  .ball-slot.pocketed { background: #141210; border-color: #2E2820; opacity: 0.4; }

  .score-value {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    color: #C8A96E;
    line-height: 1;
    letter-spacing: 0;
    min-width: 36px;
    text-align: center;
    text-shadow: 0 0 12px rgba(200,169,110,0.2);
  }
  .player-panel .score-value { min-width: unset; }
  .score-sublabel {
    font-family: 'Cormorant Garamond', serif;
    font-size: 10px;
    color: #5A4E3A;
    letter-spacing: 3px;
    text-align: center;
    text-transform: uppercase;
    font-style: italic;
  }

  /* ===== Canvas ===== */
  #c {
    display: block;
    border-radius: 4px;
    box-shadow:
      0 0 0 2px #2A2218,
      0 0 0 4px #1A1610,
      0 0 0 6px #2A2218,
      0 0 0 8px #0E0C08,
      0 8px 48px rgba(0,0,0,0.6),
      0 0 80px rgba(0,0,0,0.4);
  }

  /* ===== 底栏 ===== */
  #bottomBar {
    width: 960px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0 0 0;
  }

  #hint {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    color: #5A4E3A;
    letter-spacing: 2px;
    transition: color 0.3s;
    font-style: italic;
  }
  #hint.on { color: #C8A96E; }

  #roundInfo {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .round-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    color: #5A4E3A;
    letter-spacing: 2px;
    font-style: italic;
  }
  .round-num {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: #C8A96E;
    line-height: 1;
    text-shadow: 0 0 10px rgba(200,169,110,0.15);
  }

  /* ===== 犯规横幅 ===== */
  #foulBanner {
    position: fixed;
    top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(14,12,8,0.92);
    color: #D48060;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 5px;
    padding: 12px 36px;
    border-radius: 2px;
    border: 1px solid #D48060;
    box-shadow: 0 0 30px rgba(212,128,96,0.15), 0 4px 24px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 100;
    white-space: nowrap;
  }
  #foulBanner.show { opacity: 1; }

  /* ===== 自由球提示 ===== */
  #placingHint {
    position: fixed;
    top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(200,169,110,0.1);
    color: #C8A96E;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 4px;
    padding: 14px 36px;
    border-radius: 2px;
    border: 1px solid rgba(200,169,110,0.4);
    display: none;
    z-index: 100;
  }
  #placingHint.show { display: block; }

  /* ===== AI思考 ===== */
  #aiThinking {
    position: fixed;
    top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    color: #8A7658;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    letter-spacing: 4px;
    display: none;
    z-index: 100;
    font-style: italic;
    animation: blinkText 1.2s ease-in-out infinite;
  }
  #aiThinking.show { display: block; }
  @keyframes blinkText { 0%,100%{opacity:0.4} 50%{opacity:0.9} }

  /* ===== 胜负弹窗 ===== */
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(14,12,8,0.88);
    backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 200;
  }
  #overlay.show { opacity: 1; pointer-events: all; }

  .overlay-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin-bottom: 8px;
  }
  .overlay-icon.human { background: rgba(200,169,110,0.08); color: #C8A96E; border: 1px solid rgba(200,169,110,0.3); }
  .overlay-icon.ai { background: rgba(138,118,88,0.08); color: #8A7658; border: 1px solid rgba(138,118,88,0.3); }

  #resultTitle {
    font-family: 'Playfair Display', serif;
    font-size: 40px;
    letter-spacing: 6px;
    line-height: 1;
    text-shadow: 0 0 40px rgba(200,169,110,0.25);
  }
  #resultTitle.human { color: #C8A96E; }
  #resultTitle.ai { color: #8A7658; }

  #resultMsg {
    font-family: 'Cormorant Garamond', serif;
    color: #5A4E3A;
    font-size: 14px;
    letter-spacing: 2px;
    font-style: italic;
  }

  #restartBtn {
    margin-top: 8px;
    padding: 14px 48px;
    background: transparent;
    color: #C8A96E;
    border: 1px solid #C8A96E;
    border-radius: 2px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 5px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 0 20px rgba(200,169,110,0.06);
  }
  #restartBtn:hover {
    background: rgba(200,169,110,0.08);
    box-shadow: 0 0 30px rgba(200,169,110,0.15);
    transform: translateY(-1px);
  }

  /* ===== 开始界面 ===== */
  #startScreen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 50% 40%, #2A2218 0%, #1C1812 45%, #0E0C08 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    z-index: 300;
    transition: opacity 0.5s;
  }
  #startScreen.hidden { opacity: 0; pointer-events: none; }

  #startTitle {
    font-family: 'Playfair Display', serif;
    font-size: 88px;
    color: #C8A96E;
    letter-spacing: 24px;
    line-height: 1;
    text-shadow: 0 0 60px rgba(200,169,110,0.35), 0 0 120px rgba(200,169,110,0.12);
  }
  #startSubtitle {
    font-family: 'Cormorant Garamond', serif;
    color: #6B5C48;
    font-size: 13px;
    letter-spacing: 8px;
    text-transform: uppercase;
    font-style: italic;
    margin-top: -6px;
  }

  /* 装饰分隔线 */
  .deco-line {
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #C8A96E, transparent);
    opacity: 0.35;
  }

  /* 球的装饰展示 */
  #ballDemo {
    display: flex;
    gap: 12px;
    align-items: center;
    margin: 6px 0;
  }
  .demo-ball {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 0 10px rgba(200,169,110,0.3);
  }

  #startRules {
    font-family: 'Cormorant Garamond', serif;
    color: #5A4E3A;
    font-size: 13px;
    letter-spacing: 1px;
    line-height: 2;
    text-align: center;
    max-width: 380px;
    font-style: italic;
  }

  #startBtn {
    padding: 16px 56px;
    background: transparent;
    color: #C8A96E;
    border: 1px solid rgba(200,169,110,0.5);
    border-radius: 2px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 5px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 0 24px rgba(200,169,110,0.06);
  }
  #startBtn:hover {
    background: rgba(200,169,110,0.08);
    border-color: #C8A96E;
    box-shadow: 0 0 40px rgba(200,169,110,0.12);
    transform: translateY(-2px);
  }
</style>
</head>
<body>

<!-- 开始界面 -->
<div id="startScreen">
  <div id="startTitle">POOL</div>
  <div id="startSubtitle">人机对战 · 8球规则</div>
  <div class="deco-line"></div>
  <div id="ballDemo">
    <div class="demo-ball" style="background:#2255DD">1</div>
    <div class="demo-ball" style="background:#DD2222">2</div>
    <div class="demo-ball" style="background:#22AA44">3</div>
    <div class="demo-ball" style="background:#AA1166">4</div>
    <div class="demo-ball" style="background:#DD7700">5</div>
    <div class="demo-ball" style="background:#DD2222;border:3px solid #fff">9</div>
    <div class="demo-ball" style="background:#111;border:3px solid #fff;color:#fff">8</div>
  </div>
  <div id="startRules">
    先将己方球全部打入袋中，再打进8号黑球获胜<br>
    清空前打进8号球则判负
  </div>
  <button id="startBtn">开始游戏</button>
</div>

<!-- 游戏主界面 -->
<div id="app">
  <!-- 顶栏 -->
  <div id="topBar">
    <div class="player-panel active" id="humanPanel">
      <div class="player-side">
        <div class="player-name">玩家</div>
        <div class="player-group-label" id="humanGroup">等待分配</div>
      </div>
      <div class="ball-rack" id="humanRack"></div>
      <div>
        <div class="score-value" id="humanScore">0</div>
        <div class="score-sublabel">进球</div>
      </div>
    </div>

    <div id="titleBlock">
      <div id="gameTitle">POOL</div>
      <div id="gameSubtitle">8球 · 人机对战</div>
    </div>

    <div class="player-panel" id="aiPanel">
      <div>
        <div class="score-value" id="aiScore">0</div>
        <div class="score-sublabel">进球</div>
      </div>
      <div class="ball-rack" id="aiRack"></div>
      <div class="player-side">
        <div class="player-name" style="text-align:right">AI</div>
        <div class="player-group-label" id="aiGroup" style="text-align:right">等待分配</div>
      </div>
    </div>
  </div>

  <!-- 球桌 -->
  <canvas id="c"></canvas>

  <!-- 底栏 -->
  <div id="bottomBar">
    <div id="hint">拖拽白球瞄准 · 松手击球</div>
    <div id="roundInfo">
      <div class="round-item">
        <div class="round-num" id="humanBottomScore">0</div>
        <div>玩家</div>
      </div>
      <div style="width:1px;height:24px;background:#2E2820"></div>
      <div class="round-item">
        <div class="round-num" id="aiBottomScore">0</div>
        <div>AI</div>
      </div>
    </div>
  </div>
</div>

<!-- 犯规 -->
<div id="foulBanner">犯规！</div>
<div id="placingHint">点击台面放置白球</div>
<div id="aiThinking">AI 瞄准中...</div>

<!-- 胜负 -->
<div id="overlay">
  <div class="overlay-icon" id="overlayIcon">&#9824;</div>
  <div id="resultTitle" class="human">玩家获胜</div>
  <div id="resultMsg">清空球组后打进8号球</div>
  <button id="restartBtn">再来一局</button>
</div>

<script>
'use strict';

// ===== Canvas =====
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 960, H = 540;
canvas.width = W; canvas.height = H;

// ===== 台球桌 =====
var TX = 40, TY = 40, TW = W - 80, TH = H - 80;
var POCKETS = [
  {x: TX,        y: TY},
  {x: TX+TW/2,  y: TY},
  {x: TX+TW,    y: TY},
  {x: TX,        y: TY+TH},
  {x: TX+TW/2,  y: TY+TH},
  {x: TX+TW,    y: TY+TH},
];
var POCKET_R = 22;
var BALL_R = 14;
var POCKET_CATCH = POCKET_R * 1.8;

// ===== 球的颜色 =====
var BALL_COLORS = [
  '#E8E8E8', '#FFFFFF', '#2255DD', '#DD2222', '#22AA44',
  '#AA1166', '#DD7700', '#5511AA', '#111111', '#DD2222',
  '#22AA44', '#2255DD', '#DD7700', '#AA1166', '#CC4400', '#118855',
];
var BALL_GROUP = [0,1,1,1,1,1,1,1,0,2,2,2,2,2,2,2];

// ===== 物理 =====
var FRICTION = 0.984;
var MIN_V = 0.05;
var RESTITUTION = 0.88;
var SHOOT_SCALE = 0.18;

// ===== 球 =====
var balls = [], cueBall = null;
var isDragging = false, dragSX = 0, dragSY = 0, dragEX = 0, dragEY = 0;
var mouseX = 0, mouseY = 0;

// ===== 游戏状态 =====
var gameState = 'start';
var currentPlayer = 'human';
var playerGroup = { human: 0, ai: 0 };
var firstPocket = false, foulPending = false;
var isBreakShot = true;
var hitBalls = [], pocketedThisTurn = [];
var humanPocketed = { solid: [], stripe: [] };
var aiPocketed = { solid: [], stripe: [] };
var aiTimer = 0;

function makeBall(id, x, y) {
  return { id: id, x: x, y: y, vx: 0, vy: 0, r: BALL_R, pocketed: false };
}

function initBalls() {
  balls = [];
  cueBall = makeBall(0, TX + TW * 0.74, TY + TH / 2);
  balls.push(cueBall);
  var sx = TX + TW * 0.26, sy = TY + TH / 2, g = BALL_R * 2.1;
  var id = 1;
  for (var row = 0; row < 5; row++)
    for (var col = 0; col <= row; col++)
      balls.push(makeBall(id++, sx + row * g * 0.866, sy + (col - row / 2) * g));
}

// ===== 音频 =====
var AC = null; function getAC() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function playHit(vol) {
  try {
    var a = getAC(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.frequency.setValueAtTime(400 + Math.random() * 200, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(100, a.currentTime + 0.1);
    g.gain.setValueAtTime(vol || 0.18, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.15);
    o.start(); o.stop(a.currentTime + 0.15);
  } catch (e) {}
}
function playPocket() {
  try {
    var a = getAC(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.type = 'sine';
    o.frequency.setValueAtTime(700, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, a.currentTime + 0.5);
    g.gain.setValueAtTime(0.35, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.5);
    o.start(); o.stop(a.currentTime + 0.5);
  } catch (e) {}
}
function playShoot() {
  try {
    var a = getAC(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.type = 'sawtooth';
    o.frequency.setValueAtTime(130, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(40, a.currentTime + 0.3);
    g.gain.setValueAtTime(0.35, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.3);
    o.start(); o.stop(a.currentTime + 0.3);
  } catch (e) {}
}
function playFoul() {
  try {
    var a = getAC(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.type = 'square';
    o.frequency.setValueAtTime(200, a.currentTime);
    g.gain.setValueAtTime(0.3, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.3);
    o.start(); o.stop(a.currentTime + 0.3);
  } catch (e) {}
}
function playWin() {
  try {
    var a = getAC();
    [523, 659, 784, 1047].forEach(function(freq, i) {
      var o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination); o.type = 'sine';
      o.frequency.setValueAtTime(freq, a.currentTime + i * 0.15);
      g.gain.setValueAtTime(0.3, a.currentTime + i * 0.15);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + i * 0.15 + 0.4);
      o.start(a.currentTime + i * 0.15); o.stop(a.currentTime + i * 0.15 + 0.4);
    });
  } catch (e) {}
}

// ===== 物理 =====
function dist2(a, b) { return (a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y); }

function resolveBall(a, b) {
  var dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx*dx+dy*dy);
  if (d === 0) return;
  var nx = dx/d, ny = dy/d;
  var dv = (a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
  if (dv <= 0) return;
  var imp = dv * RESTITUTION;
  a.vx -= imp*nx; a.vy -= imp*ny;
  b.vx += imp*nx; b.vy += imp*ny;
  var pen = (a.r+b.r)-d;
  if (pen > 0) { a.x -= nx*pen*0.5; a.y -= ny*pen*0.5; b.x += nx*pen*0.5; b.y += ny*pen*0.5; }
  if (a.id===0 && hitBalls.indexOf(b)===-1) hitBalls.push(b);
  if (b.id===0 && hitBalls.indexOf(a)===-1) hitBalls.push(a);
  playHit(0.18);
}

function checkPocket(b) {
  for (var p = 0; p < POCKETS.length; p++)
    if (dist2(b, POCKETS[p]) < POCKET_CATCH*POCKET_CATCH) return true;
  return false;
}

function wallBounce(b) {
  var bounced = false;
  var L=TX+b.r, R=TX+TW-b.r, T=TY+b.r, Bo=TY+TH-b.r;
  var nearC = false;
  for (var p=0;p<POCKETS.length;p++)
    if (dist2(b,POCKETS[p])<(POCKET_CATCH+b.r)*(POCKET_CATCH+b.r)) {nearC=true; break;}
  if (!nearC) {
    if(b.x<L){b.x=L;b.vx=Math.abs(b.vx)*RESTITUTION;bounced=true;}
    if(b.x>R){b.x=R;b.vx=-Math.abs(b.vx)*RESTITUTION;bounced=true;}
    if(b.y<T){b.y=T;b.vy=Math.abs(b.vy)*RESTITUTION;bounced=true;}
    if(b.y>Bo){b.y=Bo;b.vy=-Math.abs(b.vy)*RESTITUTION;bounced=true;}
  }
  if(bounced) playHit(0.12);
}

function allStopped() {
  for (var i=0;i<balls.length;i++) {
    var b=balls[i];
    if(!b.pocketed&&(Math.abs(b.vx)>MIN_V||Math.abs(b.vy)>MIN_V)) return false;
  }
  return true;
}
function stopB(b){b.vx=0;b.vy=0;}

function update() {
  var active = []; for(var i=0;i<balls.length;i++) if(!balls[i].pocketed) active.push(balls[i]);
  for(var i=0;i<active.length;i++) {
    var b=active[i];
    if(checkPocket(b)){b.pocketed=true;stopB(b);pocketedThisTurn.push(b);}
  }
  for(var i=0;i<active.length;i++) {
    var b=active[i];
    if(b.pocketed) continue;
    b.x+=b.vx;b.y+=b.vy;
    b.vx*=FRICTION;b.vy*=FRICTION;
    if(Math.abs(b.vx)<MIN_V&&Math.abs(b.vy)<MIN_V) stopB(b);
    wallBounce(b);
  }
  for(var i=0;i<active.length;i++)
    for(var j=i+1;j<active.length;j++)
      if(!active[i].pocketed&&!active[j].pocketed&&dist2(active[i],active[j])<(active[i].r+active[j].r)*(active[i].r+active[j].r))
        resolveBall(active[i],active[j]);
}

var simRunning=false;
function startSim() {
  if(simRunning) return;
  simRunning=true;hitBalls=[];pocketedThisTurn=[];
  function loop(){ if(!allStopped()){update();requestAnimationFrame(loop);} else {simRunning=false;onSimEnd();} }
  requestAnimationFrame(loop);
}

function onSimEnd() { if(gameState==='gameover') return; processTurnEnd(); }

function remainingFor(player) {
  var g=playerGroup[player];
  if(g===0) return 7;
  return player==='human'? (g===1?7-humanPocketed.solid.length:7-humanPocketed.stripe.length)
                          : (g===1?7-aiPocketed.solid.length:7-aiPocketed.stripe.length);
}

function hasRemainingBalls(player) {
  var g=playerGroup[player];
  if(g===0) return true;
  return balls.some(function(b){ return !b.pocketed && b.id!==0 && BALL_GROUP[b.id]===g; });
}

function processTurnEnd() {
  var cp=currentPlayer, og=playerGroup[cp];
  var wasBreakShot = isBreakShot;

  // ===== 1. 犯规检测 =====
  var foul=false, foulMsg='';

  if(cueBall.pocketed){
    foul=true; foulMsg='白球进袋！犯规';
  } else if(hitBalls.length===0){
    foul=true; foulMsg='未击中任何球！犯规';
  } else {
    var fh=hitBalls[0], fhG=BALL_GROUP[fh.id];
    var canHit8 = !hasRemainingBalls(cp);
    // 首先击中8号球：仅在已分球组 且 有剩余球时犯规（清空阶段才能打8号）
    if(fhG===0 && og!==0 && !canHit8){ foul=true; foulMsg='首先击中8号球！犯规'; }
    // 首先击中对方球：已分球组后适用
    else if(fhG!==0 && fhG!==og && og!==0){ foul=true; foulMsg='首先击中对方球！犯规'; }
    // 8号球进袋：仅在已分球组 且 还有剩余球时犯规（分配前打进8号不罚）
    if(!foul){
      for(var i=0;i<pocketedThisTurn.length;i++){
        if(pocketedThisTurn[i].id===8 && og!==0 && hasRemainingBalls(cp)){
          foul=true; foulMsg='清空前打进8号球！犯规'; break;
        }
      }
    }
  }

  // ===== 2. 进袋记录（只记录自己的球）=====
  for(var i=0;i<pocketedThisTurn.length;i++){
    var pb=pocketedThisTurn[i];
    if(pb.id===0) continue;
    var pg=BALL_GROUP[pb.id];
    if(pg===og){
      if(cp==='human'){ if(pg===1) humanPocketed.solid.push(pb.id); else humanPocketed.stripe.push(pb.id); }
      else            { if(pg===1) aiPocketed.solid.push(pb.id);    else aiPocketed.stripe.push(pb.id); }
    }
  }

  // ===== 3. 球组分配（仅在合法进球时分配，跳过8号）=====
  if(!foul && !firstPocket && og===0){
    for(var i=0;i<pocketedThisTurn.length;i++){
      var pb=pocketedThisTurn[i];
      if(pb.id===0 || BALL_GROUP[pb.id]===0) continue; // 跳过白球和8号
      firstPocket=true;
      playerGroup[cp]=BALL_GROUP[pb.id];
      var other=cp==='human'?'ai':'human';
      playerGroup[other]=playerGroup[other]===0?(BALL_GROUP[pb.id]===1?2:1):playerGroup[other];
      break;
    }
  }
  isBreakShot=false;

  // ===== 4. 8号球进袋终局判定 =====
  for(var i=0;i<pocketedThisTurn.length;i++){
    var pb=pocketedThisTurn[i];
    if(pb.id===8){
      if(foul && cueBall.pocketed){ endGame(cp==='human'?'ai':'human','scratch8'); return; }
      if(!hasRemainingBalls(cp)){ endGame(cp,'normal'); return; }
      foul=true; foulMsg='清空前打进8号球！犯规'; break;
    }
  }

  // ===== 5. 犯规处理 =====
  if(foul){
    playFoul(); showFoul(foulMsg);
    if(wasBreakShot){
      // 开球犯规：白球放回起点，换对手开球
      cueBall.pocketed=false;
      cueBall.x=TX+TW*0.74; cueBall.y=TY+TH/2; stopB(cueBall);
      currentPlayer=cp==='human'?'ai':'human';
      updateHUD();
      if(currentPlayer==='ai') scheduleAI();
      return;
    }
    // 非开球犯规：自由球，下家接手
    if(cp==='ai'){
      // AI 犯规 → 玩家获得自由球（玩家自己放球）
      currentPlayer='human';
      gameState='placing';
      cueBall.pocketed=false;
      cueBall.x=TX+TW*0.74; cueBall.y=TY+TH/2; stopB(cueBall);
      document.getElementById('placingHint').classList.add('show');
    } else {
      // 玩家犯规 → AI 获得自由球（AI 自动放置白球）
      currentPlayer='ai';
      gameState='placing'; // doAIturn 会检测到 placing 并自动放球
      document.getElementById('aiThinking').classList.add('show');
      aiTimer=setTimeout(function(){
        document.getElementById('aiThinking').classList.remove('show');
        doAIturn();
      },600);
    }
    updateHUD();
    return;
  }

  // ===== 6. 合法回合结束 → 判断是否继续 =====
  var ownGroup = playerGroup[cp];
  // 统计进袋：自己的球（按类型）和非己方彩球
  var myPocketed  = pocketedThisTurn.filter(function(b){ return b.id!==0 && BALL_GROUP[b.id]===ownGroup; });
  var oppPocketed = pocketedThisTurn.filter(function(b){ return b.id!==0 && BALL_GROUP[b.id]!==ownGroup && BALL_GROUP[b.id]!==0; });
  var anyPocketed = pocketedThisTurn.filter(function(b){ return b.id!==0; }).length > 0;

  if(ownGroup !== 0){
    // 已分球组：进了自己的球（且无犯规）→ 继续；只进了对方球 → 换人
    if(myPocketed.length > 0){
      updateHUD();
      if(cp==='human'){ gameState='aiming'; }
      else { scheduleAI(); }
    } else {
      // 进了对方的球，或什么都没进 → 换人
      switchPlayer(); updateHUD();
    }
  } else {
    // 尚未分球组（开球阶段）：只要进了任何合法球（非8号）就继续
    if(anyPocketed){
      updateHUD();
      if(cp==='human'){ gameState='aiming'; }
      else { scheduleAI(); }
    } else {
      switchPlayer(); updateHUD();
    }
  }
}

function switchPlayer(){
  currentPlayer=currentPlayer==='human'?'ai':'human';
  if(currentPlayer==='ai') scheduleAI(); else gameState='aiming';
}

function scheduleAI(){
  // 若已处于 placing 状态，processTurnEnd 已直接安排好 AI 放球，跳过思考动画
  if (gameState === 'placing') return;
  gameState='aiThinking';
  document.getElementById('aiThinking').classList.add('show');
  aiTimer=setTimeout(function(){
    document.getElementById('aiThinking').classList.remove('show');
    doAIturn();
  },900);
}

function showFoul(msg){ var el=document.getElementById('foulBanner'); el.textContent=msg; el.classList.add('show'); setTimeout(function(){el.classList.remove('show');},2000); }

function showOverlay(title,msg,isHuman){
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultTitle').className=isHuman?'human':'ai';
  document.getElementById('overlayIcon').className='overlay-icon '+(isHuman?'human':'ai');
  document.getElementById('resultMsg').textContent=msg;
  document.getElementById('overlay').classList.add('show');
}

function endGame(win,reason){
  gameState='gameover';
  if(aiTimer){clearTimeout(aiTimer);aiTimer=0;}
  document.getElementById('aiThinking').classList.remove('show');
  var label=win==='human'?'玩家获胜':'AI获胜';
  var msg='';
  if(reason==='normal')     msg='清空球组后打进8号球，获得胜利！';
  else if(reason==='early8')  msg='还有球未清空就打进8号球，判负';
  else if(reason==='scratch8') msg='白球和8号球同时进袋，判负';
  playWin();
  showOverlay(label,msg,win==='human');
}

// ===== AI =====
function doAIturn(){
  if(currentPlayer !== 'ai') return;

  // 犯规后需要先放置白球
  if (gameState === 'placing') {
    gameState = 'simulating';
    document.getElementById('placingHint').classList.remove('show');
    // AI 自由球：在全场范围内找对自己最有利的放球位置
    var og = playerGroup['ai'];
    var candidates = [];

    // 找自己的目标球
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (b.pocketed || b.id === 0) continue;
      if (og !== 0 && BALL_GROUP[b.id] !== og && b.id !== 8) continue;
      if (og === 0 || remainingFor('ai') === 0) {
        if (b.id !== 8) continue; // 只有8号球可打时才能放8号
      }
      candidates.push(b);
    }

    // 如果AI没有自己的球（还没分配球组），找任意一个彩球
    if (candidates.length === 0) {
      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        if (!b.pocketed && b.id !== 0 && b.id !== 8) candidates.push(b);
      }
    }

    var cx = TX + TW * 0.74, cy = TY + TH / 2;
    if (candidates.length > 0) {
      // 选一个随机目标球，在它附近放置白球（制造有进攻角度的位置）
      var target = candidates[Math.floor(Math.random() * candidates.length)];
      var angle = Math.random() * Math.PI * 2;
      var radius = BALL_R * 5 + Math.random() * (TW * 0.3);
      cx = target.x + Math.cos(angle) * radius;
      cy = target.y + Math.sin(angle) * radius;
    }

    cx = Math.max(TX + BALL_R * 1.5, Math.min(TX + TW - BALL_R * 1.5, cx));
    cy = Math.max(TY + BALL_R * 1.5, Math.min(TY + TH - BALL_R * 1.5, cy));
    cueBall.pocketed = false;
    cueBall.x = cx; cueBall.y = cy; stopB(cueBall);
    updateHUD();
    setTimeout(function() { doAIshot(); }, 300);
    return;
  }

  doAIshot();
}

function doAIshot(){
  var og=playerGroup['ai'];
  var targets=[];
  if(og===0||remainingFor('ai')>0){
    for(var i=0;i<balls.length;i++){
      var b=balls[i];
      if(b.pocketed||b.id===0) continue;
      if(og!==0&&BALL_GROUP[b.id]!==og) continue;
      targets.push(b);
    }
  }
  if(targets.length===0){
    for(var i=0;i<balls.length;i++){var b=balls[i];if(!b.pocketed&&b.id===8){targets.push(b);break;}}
  }
  if(targets.length===0){ aimAtBall(balls[Math.floor(Math.random()*balls.length)],0.5); return; }
  var best=null, bestScore=-Infinity;
  for(var i=0;i<targets.length;i++){
    var t=targets[i];
    var dist=Math.sqrt((t.x-cueBall.x)*(t.x-cueBall.x)+(t.y-cueBall.y)*(t.y-cueBall.y));
    var score=1000-dist+Math.random()*50;
    if(score>bestScore){bestScore=score;best=t;}
  }
  aimAtBall(best,0.75+Math.random()*0.25);
}

function aimAtBall(target,accuracy){
  if(cueBall.pocketed){cueBall.pocketed=false;cueBall.x=TX+TW*0.74;cueBall.y=TY+TH/2;stopB(cueBall);}
  var dx=target.x-cueBall.x,dy=target.y-cueBall.y,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<1) dist=1;
  var nx=dx/dist,ny=dy/dist;
  var ae=(1-accuracy)*0.5;
  var ax=nx+(Math.random()-0.5)*2*ae,ay=ny+(Math.random()-0.5)*2*ae;
  var al=Math.sqrt(ax*ax+ay*ay); nx=ax/al; ny=ay/al;
  var power=Math.min(dist*0.018+2,16)*(0.65+Math.random()*0.7);
  cueBall.vx=nx*power; cueBall.vy=ny*power;
  playShoot(); gameState='simulating'; updateHUD(); startSim();
}

// ===== HUD =====
function groupLabel(g){ if(g===1)return'实心球'; if(g===2)return'花球'; return'等待分配'; }

function updateHUD(){
  var og=playerGroup['human'], oa=playerGroup['ai'];
  document.getElementById('humanGroup').textContent = groupLabel(og);
  document.getElementById('aiGroup').textContent     = groupLabel(oa);
  document.getElementById('humanPanel').className     = 'player-panel' + (currentPlayer==='human'?' active':'');
  document.getElementById('aiPanel').className        = 'player-panel' + (currentPlayer==='ai'?' active':'');

  var solidIds=[1,2,3,4,5,6,7], stripeIds=[9,10,11,12,13,14,15];
  function makeRack(ids,pocketed){
    var h='';
    for(var i=0;i<ids.length;i++){
      var id=ids[i], filled=pocketed.indexOf(id)!==-1, g=BALL_GROUP[id];
      var cls='ball-slot'+(filled?' pocketed':(g===1?' solid':(g===2?' stripe':'')));
      h+='<div class="'+cls+'"></div>';
    }
    return h;
  }
  document.getElementById('humanRack').innerHTML = makeRack(solidIds,humanPocketed.solid)+makeRack(stripeIds,humanPocketed.stripe);
  document.getElementById('aiRack').innerHTML     = makeRack(solidIds,aiPocketed.solid)+makeRack(stripeIds,aiPocketed.stripe);

  var hScore=countPocketedFor('human'), aScore=countPocketedFor('ai');
  document.getElementById('humanScore').textContent = hScore;
  document.getElementById('aiScore').textContent     = aScore;
  document.getElementById('humanBottomScore').textContent = hScore;
  document.getElementById('aiBottomScore').textContent     = aScore;

  var hintEl = document.getElementById('hint');
  if(gameState==='placing'&&currentPlayer==='human'){ hintEl.textContent='点击台面放置白球'; hintEl.className='on'; }
  else if(currentPlayer==='human'&&gameState==='aiming'){ hintEl.textContent='拖拽白球瞄准 · 松手击球'; hintEl.className='on'; }
  else { hintEl.textContent=''; hintEl.className=''; }
}
function countPocketedFor(player){
  var g=playerGroup[player];
  if(g===0) return 0;
  return player==='human'? (g===1?humanPocketed.solid.length:humanPocketed.stripe.length)
                          : (g===1?aiPocketed.solid.length:aiPocketed.stripe.length);
}

// ===== 绘制 =====

function drawTable(){
  // 外框
  ctx.fillStyle='#1E3A28';
  ctx.fillRect(TX-30,TY-30,TW+60,TH+60);
  ctx.fillStyle='#2D4E38';
  ctx.fillRect(TX-24,TY-24,TW+48,TH+48);
  ctx.strokeStyle='#3A5E48';
  ctx.lineWidth=2;
  ctx.strokeRect(TX-22,TY-22,TW+44,TH+44);

  // 台面
  ctx.fillStyle='#1A5C28';
  ctx.fillRect(TX,TY,TW,TH);

  // 纹理
  ctx.strokeStyle='rgba(0,0,0,0.06)';
  ctx.lineWidth=1;
  for(var x=TX+20;x<TX+TW;x+=20){ctx.beginPath();ctx.moveTo(x,TY);ctx.lineTo(x,TY+TH);ctx.stroke();}
  for(var y=TY+20;y<TY+TH;y+=20){ctx.beginPath();ctx.moveTo(TX,y);ctx.lineTo(TX+TW,y);ctx.stroke();}

  // 中线
  ctx.strokeStyle='rgba(255,255,255,0.06)';
  ctx.beginPath();ctx.moveTo(TX+TW/2,TY);ctx.lineTo(TX+TW/2,TY+TH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(TX,TY+TH/2);ctx.lineTo(TX+TW,TY+TH/2);ctx.stroke();

  // 袋口
  for(var pi=0;pi<POCKETS.length;pi++){
    var p=POCKETS[pi];
    ctx.fillStyle='#060402';
    ctx.beginPath();ctx.arc(p.x,p.y,POCKET_R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#3A5E48';ctx.lineWidth=3;ctx.stroke();
  }
}

function drawBall(b){
  if(b.pocketed) return;
  var col=BALL_COLORS[b.id], isStripe=b.id>8;
  ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  if(isStripe){
    ctx.save();
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.clip();
    ctx.fillStyle='#ffffff';
    ctx.fillRect(b.x-b.r,b.y-b.r*0.38,b.r*2,b.r*0.76);
    ctx.restore();
  }
  ctx.fillStyle='rgba(255,255,255,0.45)';
  ctx.beginPath();ctx.arc(b.x-b.r*0.35,b.y-b.r*0.35,b.r*0.26,0,Math.PI*2);ctx.fill();
  if(b.id>0){
    var numBG=(b.id===1||b.id===8)?'#ffffff':'#222222';
    var numFG=(b.id===1||b.id===8)?'#111111':'#ffffff';
    ctx.fillStyle=numBG;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.52,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=numFG;
    ctx.font='bold '+Math.round(b.r*0.72)+'px Arial';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.id,b.x,b.y+1);
  }
}

function drawCue(){
  if(!isDragging||cueBall.pocketed||!allStopped()||gameState!=='aiming') return;
  // 用 dragEX/dragEY（拖拽终点，实时跟随鼠标，允许越出桌面）
  var dx=dragSX-dragEX,dy=dragSY-dragEY, d=Math.sqrt(dx*dx+dy*dy);
  if(d<8) return;
  var nx=dx/d,ny=dy/d, pullback=Math.min(d,130);
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1.5; ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.moveTo(cueBall.x,cueBall.y); ctx.lineTo(cueBall.x-nx*220,cueBall.y-ny*220); ctx.stroke(); ctx.setLineDash([]);
  var sX=cueBall.x+nx*pullback,sY=cueBall.y+ny*pullback;
  var eX=cueBall.x+nx*(pullback+240),eY=cueBall.y+ny*(pullback+240);
  var lg=ctx.createLinearGradient(sX,sY,eX,eY);
  lg.addColorStop(0,'#d8c090');lg.addColorStop(0.1,'#c8a870');lg.addColorStop(0.3,'#b09050');lg.addColorStop(0.6,'#906030');lg.addColorStop(1,'#7a5020');
  ctx.strokeStyle=lg;ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(sX,sY);ctx.lineTo(eX,eY);ctx.stroke();
  ctx.fillStyle='#88ccdd';
  ctx.beginPath();ctx.arc(sX,sY,4.5,0,Math.PI*2);ctx.fill();
  var bW=110,bX=cueBall.x-bW/2,bY=cueBall.y+BALL_R+22;
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(bX-2,bY-3,bW+4,10);
  var rat=Math.min(d*SHOOT_SCALE/18,1);
  ctx.fillStyle=rat<0.4?'#4caf50':rat<0.75?'#ff9800':'#f44336';
  ctx.fillRect(bX,bY,bW*rat,6);
  ctx.restore();
}

function drawPlacementPreview(){
  if(gameState!=='placing') return;
  // 半透明白球跟随鼠标（限制在台面内）
  var mx=Math.max(TX,Math.min(TX+TW,mouseX));
  var my=Math.max(TY,Math.min(TY+TH,mouseY));
  ctx.save();ctx.globalAlpha=0.65;
  ctx.fillStyle='#FFFFFF';
  ctx.beginPath();ctx.arc(mx,my,BALL_R,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#1B5E20';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(mx,my,BALL_R,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawTable();
  for(var i=0;i<balls.length;i++) drawBall(balls[i]);
  if(gameState==='placing') drawPlacementPreview();
  else drawCue();
}

function gameLoop(){
  if(gameState!=='gameover'&&gameState!=='start'&&!allStopped()) update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ===== 输入 =====
// 统一鼠标坐标更新（允许越出 canvas）
function updateMousePos(e){
  var rect=canvas.getBoundingClientRect();
  mouseX=(e.clientX-rect.left)*(W/rect.width);
  mouseY=(e.clientY-rect.top)*(H/rect.height);
}
canvas.addEventListener('mousedown',function(e){
  var rect=canvas.getBoundingClientRect();
  var px=(e.clientX-rect.left)*(W/rect.width), py=(e.clientY-rect.top)*(H/rect.height);
  // 记录真实坐标（可能越界），用于力度计算
  mouseX=px;mouseY=py;
  if(gameState==='placing'){
    // 允许在台面范围内任意放置白球（靠近边界时自动限制）
    if(px>TX+BALL_R&&px<TX+TW-BALL_R&&py>TY+BALL_R&&py<TY+TH-BALL_R){
      cueBall.pocketed=false;cueBall.x=px;cueBall.y=py;stopB(cueBall);
    } else if(px>TX&&px<TX+TW&&py>TY&&py<TY+TH){
      // 边界附近，限制在有效范围
      cueBall.pocketed=false;cueBall.x=Math.max(TX+BALL_R,Math.min(TX+TW-BALL_R,px));
      cueBall.y=Math.max(TY+BALL_R,Math.min(TY+TH-BALL_R,py));stopB(cueBall);
    }
    gameState='aiming';foulPending=false;
    document.getElementById('placingHint').classList.remove('show');
    updateHUD();
    return;
  }
  if(gameState!=='aiming'||currentPlayer!=='human'||!allStopped()||cueBall.pocketed) return;
  if(dist2({x:px,y:py},cueBall)<(BALL_R*3.5)*(BALL_R*3.5)){ isDragging=true;dragSX=px;dragSY=py;dragEX=px;dragEY=py; }
});

canvas.addEventListener('mousemove',function(e){
  updateMousePos(e);
  // 拖拽中实时更新终点（允许拖出桌面）
  if(isDragging){ dragEX=mouseX; dragEY=mouseY; }
});

// 挂在 document 层级：鼠标离开 canvas 后仍能收到事件（蓄力、击球）
document.addEventListener('mousemove', function(e){ updateMousePos(e); if(isDragging){ dragEX=mouseX; dragEY=mouseY; } });
document.addEventListener('mouseup',function(){
  if(!isDragging) return;
  isDragging=false;
  if(gameState!=='aiming'||currentPlayer!=='human'||cueBall.pocketed) return;
  // 力度和方向都用拖拽起点到终点的真实距离（可以拖出桌面）
  var dx=dragSX-dragEX,dy=dragSY-dragEY,d=Math.sqrt(dx*dx+dy*dy);
  if(d<6) return;
  var nx=dx/d,ny=dy/d;
  cueBall.vx=nx*d*SHOOT_SCALE; cueBall.vy=ny*d*SHOOT_SCALE;
  playShoot(); gameState='simulating'; updateHUD(); startSim();
});

canvas.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];canvas.dispatchEvent(new MouseEvent('mousedown',{clientX:t.clientX,clientY:t.clientY}));},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];canvas.dispatchEvent(new MouseEvent('mousemove',{clientX:t.clientX,clientY:t.clientY}));},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();canvas.dispatchEvent(new MouseEvent('mouseup'));},{passive:false});

document.getElementById('restartBtn').addEventListener('click',function(){
  document.getElementById('overlay').classList.remove('show');
  restartGame();
});

document.getElementById('startBtn').addEventListener('click',function(){
  var ss=document.getElementById('startScreen');
  ss.classList.add('hidden');
  setTimeout(function(){ss.style.display='none'; gameState='aiming'; updateHUD();},500);
});

function restartGame(){
  gameState='aiming';currentPlayer='human';
  playerGroup={human:0,ai:0};firstPocket=false;foulPending=false;
  isBreakShot=true;hitBalls=[];pocketedThisTurn=[];
  humanPocketed={solid:[],stripe:[]};aiPocketed={solid:[],stripe:[]};
  if(aiTimer){clearTimeout(aiTimer);aiTimer=0;}
  initBalls();updateHUD();
}

// ===== 启动 =====
initBalls();updateHUD();gameLoop();
</script>
</body>
